[package]
name = "kanban-storage-spike"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.6", features = ["custom-protocol"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[workspace]
