[package]
name = "kanban-workspace"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "collation", "backup"] }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[workspace]
